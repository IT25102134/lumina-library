spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:lumina_library};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_CERTIFICATE:true}
spring.datasource.username=${DB_USERNAME:lumina_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Edit feedback case')}"></head>

<body>

<aside th:replace="~{fragments/layout :: sidebar('feedback')}"></aside>

<div class="app-shell">

  <header th:replace="~{fragments/layout :: topbar(
        'Edit feedback case',
        'Member services'
    )}"></header>

  <main class="content">

    <div th:replace="~{fragments/layout :: flashes}"></div>

    <section class="panel form-panel">

      <div class="panel-head">
        <h2>Edit your case</h2>

        <span class="status"
              th:text="${item.referenceNumber}">
                    Case reference
                </span>
      </div>

      <div class="panel-body">

        <p class="muted">
          You can edit an open case before a conversation
          or review starts.
        </p>

        <!-- The service checks ownership using the existing login. -->
        <form th:action="@{/feedback/{id}/edit(id=${item.id})}"
              th:object="${feedbackForm}"
              method="post"
              class="form-grid">

          <input type="hidden"
                 th:name="${_csrf.parameterName}"
                 th:value="${_csrf.token}"/>

          <label class="field">
            Type

            <select th:field="*{type}" required>
              <option th:each="t : ${types}"
                      th:value="${t}"
                      th:text="${t.displayName}">
              </option>
            </select>

            <small class="field-error"
                   th:if="${#fields.hasErrors('type')}"
                   th:errors="*{type}">
            </small>
          </label>

          <label class="field">
            Category

            <select th:field="*{category}" required>
              <option value="">Select a category</option>

              <option th:each="c : ${categories}"
                      th:value="${c}"
                      th:text="${c}">
              </option>
            </select>

            <small class="field-error"
                   th:if="${#fields.hasErrors('category')}"
                   th:errors="*{category}">
            </small>
          </label>

          <label class="field full">
            Subject

            <input th:field="*{subject}"
                   maxlength="180"
                   required/>

            <small class="field-error"
                   th:if="${#fields.hasErrors('subject')}"
                   th:errors="*{subject}">
            </small>
          </label>

          <label class="field full">
            Message

            <textarea th:field="*{message}"
                      rows="6"
                      minlength="10"
                      maxlength="2500"
                      required></textarea>

            <small class="field-error"
                   th:if="${#fields.hasErrors('message')}"
                   th:errors="*{message}">
            </small>
          </label>

          <div class="form-footer full">

            <button type="submit" class="btn btn-amber">
              Save changes
            </button>

            <a th:href="@{/feedback}"
               class="btn btn-outline">
              Cancel
            </a>

          </div>

        </form>

      </div>

    </section>

  </main>

</div>

</body>
</html>

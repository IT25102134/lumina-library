<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Catalogue')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('catalog')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Explore the collection','Catalogue')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div>
<div class="page-actions"><form class="search-bar" th:action="@{/catalog}" method="get"><input name="q" th:value="${q}" placeholder="Search title, author, ISBN or category…"><button class="btn btn-ink btn-sm">Search</button></form><a sec:authorize="hasRole('HEAD_LIBRARIAN')" class="btn btn-amber" th:href="@{/catalog/manage/new}">＋ New catalogue record</a></div>
<section class="catalog-grid"><article class="catalog-card" th:each="book:${books}"><div class="catalog-cover"><img th:src="${book.coverUrl==null||book.coverUrl.isBlank()?'https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=700&q=80':book.coverUrl}" th:alt="${book.title}"><span class="status" th:classappend="${availability[book.id]>0}?'available':'unpaid'" th:text="${availability[book.id]>0?availability[book.id]+' available':'Unavailable'}">Available</span></div><div class="catalog-info"><small th:text="${book.category}+' · '+${book.publicationYear}">Category</small><h3 th:text="${book.title}">Book title</h3><p><span th:text="${book.author}">Author</span><br><span th:text="${book.description}">Description</span></p><div class="card-actions"><form sec:authorize="hasRole('MEMBER')" th:action="@{/my-library/borrow/{id}(id=${book.id})}" method="post"><button class="btn btn-ink btn-sm" th:disabled="${availability[book.id]==0}">Request book</button></form><form sec:authorize="hasRole('MEMBER')" th:action="@{/my-library/reading-list/{id}(id=${book.id})}" method="post"><button class="btn btn-outline btn-sm">♡ Save</button></form><a sec:authorize="hasRole('MEMBER')" th:if="${book.ebookUrl!=null&&!book.ebookUrl.isBlank()}" class="btn btn-outline btn-sm" th:href="${book.ebookUrl}" target="_blank">Read e-book</a><a sec:authorize="hasRole('HEAD_LIBRARIAN')" class="btn btn-outline btn-sm" th:href="@{/catalog/manage/{id}/edit(id=${book.id})}">Edit</a><form sec:authorize="hasRole('HEAD_LIBRARIAN')" data-confirm="Archive this catalogue record?" th:action="@{/catalog/manage/{id}/delete(id=${book.id})}" method="post"><button class="btn btn-danger btn-sm">Archive</button></form></div></div></article></section><div th:if="${#lists.isEmpty(books)}" class="panel empty-state"><strong>No titles found</strong>Try a broader author, title, ISBN or category.</div>
</main></div></body></html>

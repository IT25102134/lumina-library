<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Audit log')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('audit')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Audit trail','Security & accountability')}"></header><main class="content"><section class="panel"><div class="panel-head"><h2>Recorded system actions</h2><span class="status" th:text="${#lists.size(logs)}+' shown'">0</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody><tr th:each="log:${logs}"><td th:text="${#temporals.format(log.occurredAt,'dd MMM yyyy · HH:mm')}">Time</td><td th:text="${log.actor}">Actor</td><td><span class="status" th:text="${log.action}">Action</span></td><td th:text="${log.entityType}+' #'+${log.entityId}">Entity</td><td class="muted" th:text="${log.details}">Details</td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="5" class="empty-state"><strong>No actions recorded yet</strong>Important changes will be preserved here.</td></tr></tbody></table></div></section></main></div></body></html>

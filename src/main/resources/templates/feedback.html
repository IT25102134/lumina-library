<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Feedback')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('feedback')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Share your voice','Feedback & support')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><div class="split-grid"><section class="panel"><div class="panel-head"><h2>Send us a message</h2></div><form class="panel-body form-stack" th:action="@{/feedback}" method="post"><label>Message type<select name="type"><option th:each="t:${types}" th:value="${t}" th:text="${#strings.capitalize(#strings.toLowerCase(t.name()))}"></option></select></label><label>Subject<input name="subject" required maxlength="180" placeholder="A short, clear summary"></label><label>Tell us more<textarea name="message" required maxlength="2500" placeholder="Share the details that will help us understand…"></textarea></label><button class="btn btn-amber">Submit securely →</button></form></section><section class="stack"><article class="panel case-card" th:each="item:${items}"><header><div><span class="pill" th:text="${item.type}">FEEDBACK</span><h3 th:text="${item.subject}">Subject</h3></div><span class="status" th:classappend="${#strings.toLowerCase(item.status.name())}" th:text="${item.status}">OPEN</span></header><p class="message" th:text="${item.message}">Message</p><div th:if="${item.response!=null&&!item.response.isBlank()}" class="case-response"><b>Library response</b><p th:text="${item.response}">Response</p></div><small class="muted" th:text="'Case #'+${item.id}+' · '+${#temporals.format(item.createdAt,'dd MMM yyyy')}">Case</small></article><div th:if="${#lists.isEmpty(items)}" class="panel empty-state"><strong>No messages yet</strong>Your submitted feedback and responses will appear here.</div></section></div></main></div></body></html>

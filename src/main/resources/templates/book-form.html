<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Book record')}"></head>
<body><aside th:replace="~{fragments/layout :: sidebar('catalog')}"></aside><div class="app-shell">
<header th:replace="~{fragments/layout :: topbar('Catalogue record','Catalog management')}"></header>
<!-- The same Head-Librarian form is used for both creating and editing a catalogue record. -->
<main class="content"><section class="panel form-panel"><div class="panel-head"><h2>Bibliographic details</h2><span class="status">* Required fields</span></div>
<!-- multipart/form-data allows the normal Book fields and the optional coverImage file to be submitted together. -->
<!-- The hidden ID tells CatalogController whether this submission creates a new record or updates an existing one. -->
<form class="panel-body" th:action="@{/catalog/manage/save}" th:object="${book}" method="post" enctype="multipart/form-data"><input type="hidden" th:field="*{id}"><div class="form-grid">
<!-- Required identity and discovery fields used by catalogue display and search. -->
<label class="field">ISBN <b class="required">*</b><input th:field="*{isbn}" required placeholder="9780000000000"></label><label class="field">Title <b class="required">*</b><input th:field="*{title}" required></label>
<label class="field">Author <b class="required">*</b><input th:field="*{author}" required></label><label class="field">Category <b class="required">*</b><input th:field="*{category}" required placeholder="Fiction, Science, History…"></label>
<!-- Optional publication metadata retained on the Book entity. -->
<label class="field">Publisher<input th:field="*{publisher}"></label><label class="field">Publication year<input th:field="*{publicationYear}" type="number" min="1000" max="2100"></label>
<!-- Optional summary displayed on the catalogue card. -->
<label class="field full">Description<textarea th:field="*{description}" placeholder="A concise introduction for readers"></textarea></label>
<!-- A remote cover URL or validated local image can supply the cover; ebookUrl controls the member Read e-book link. -->
<label class="field full">Cover image URL (optional)<input th:field="*{coverUrl}" type="url" placeholder="https://…"></label><label class="field full">Or select an image from your device<input name="coverImage" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label><label class="field full">E-book URL (optional)<input th:field="*{ebookUrl}" type="url" placeholder="https://…"></label>
<!-- Cancel returns without submitting; the amber button sends the create/update POST request. -->
</div><div class="form-footer"><a class="btn btn-outline" th:href="@{/catalog}">Cancel</a><button class="btn btn-amber">Save catalogue record →</button></div></form></section></main></div></body></html>

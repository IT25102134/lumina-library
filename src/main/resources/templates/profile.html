<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Profile')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('My profile','Account settings')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><section class="panel form-panel"><div class="panel-head"><h2>Personal details</h2><span class="status active" th:text="${profile.role.displayName}">Role</span></div><form class="panel-body" th:action="@{/profile}" method="post"><div class="form-grid"><label class="field">First name<input name="firstName" th:value="${profile.firstName}" required></label><label class="field">Last name<input name="lastName" th:value="${profile.lastName}" required></label><label class="field">Login username (email)<input name="email" type="email" th:value="${profile.email}" required></label><label class="field">Phone<input name="phone" th:value="${profile.phone}" placeholder="+94 …"></label><label class="field">Member / staff number<input th:value="${profile.membershipNumber}" disabled></label><label class="field">Account created<input th:value="${#temporals.format(profile.createdAt,'dd MMMM yyyy')}" disabled></label><label class="field">New password (optional)<span class="password-field"><input id="new-password" name="password" type="password" minlength="8"><button class="password-toggle" type="button" data-password-toggle="new-password" aria-label="Show password" aria-pressed="false">👁</button></span></label><label class="field">Confirm new password<span class="password-field"><input id="confirm-password" name="confirmPassword" type="password" minlength="8"><button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password" aria-pressed="false">👁</button></span></label></div><div class="form-footer"><button class="btn btn-amber">Save profile →</button></div></form></section></main></div></body></html>

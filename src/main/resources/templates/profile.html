<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Profile')}"></head>

<body>
    <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>
    <div class="app-shell">
        <header th:replace="~{fragments/layout :: topbar('My profile','Account settings')}"></header>
        <main class="content">
            <div th:replace="~{fragments/layout :: flashes}"></div>
            <section class="panel form-panel">
                <div class="panel-head">
                    <h2>Personal details</h2>
                    <span class="status active" th:text="${profile.role.displayName}">Role</span>
                </div>
                <form class="panel-body" th:action="@{/profile}" method="post" id="profileForm">
                    <div class="form-grid">
                        <label class="field">
                            <span>First name</span>
                            <input name="firstName" id="firstName" th:value="${profile.firstName}" required
                                autocomplete="given-name">
                            <span class="field-error-msg" id="firstNameError"
                                style="display:none; color:var(--danger); font-size:12px; margin-top:6px; font-weight:600; text-transform:none;">⚠️
                                Numbers are not allowed in First name</span>
                        </label>

                        <label class="field">
                            <span>Last name</span>
                            <input name="lastName" id="lastName" th:value="${profile.lastName}" required
                                autocomplete="family-name">
                            <span class="field-error-msg" id="lastNameError"
                                style="display:none; color:var(--danger); font-size:12px; margin-top:6px; font-weight:600; text-transform:none;">⚠️
                                Numbers are not allowed in Last name</span>
                        </label>

                        <label class="field">
                            <span>Login username (email)</span>
                            <input name="email" type="email" th:value="${profile.email}" required>
                        </label>

                        <label class="field">
                            <span>Phone</span>
                            <div class="phone-input-wrap" id="phoneWrap">
                                <div class="phone-prefix-badge" title="Sri Lanka (+94)">
                                    <span class="phone-country">LK</span>
                                    <span class="phone-code">+94</span>
                                    <span class="phone-divider"></span>
                                </div>
                                <input type="tel" id="phoneInput" placeholder="7X XXX XXXX" autocomplete="tel-national"
                                    inputmode="numeric" maxlength="11">
                            </div>
                            <input type="hidden" name="phone" id="phoneHidden" th:value="${profile.phone}">
                            <span class="field-error-msg" id="phoneError"
                                style="display:none; color:var(--danger); font-size:12px; margin-top:6px; font-weight:600; text-transform:none;">⚠️
                                Please enter a valid 9-digit Sri Lankan phone number (numbers only)</span>
                        </label>

                        <label class="field">
                            <span>Member / staff number</span>
                            <div class="staff-number-wrap" id="staffNumWrap">
                                <div class="staff-prefix-badge" title="Prefix">
                                    <span class="staff-prefix-text" id="staffPrefixText">STAFF-</span>
                                    <span class="staff-prefix-divider"></span>
                                </div>
                                <input type="text" id="staffDigitsInput" placeholder="002" maxlength="3"
                                    inputmode="numeric" autocomplete="off">
                            </div>
                            <input type="hidden" name="membershipNumber" id="membershipNumberHidden"
                                th:value="${profile.membershipNumber}">
                            <span class="field-error-msg" id="staffNumError"
                                style="display:none; color:var(--danger); font-size:12px; margin-top:6px; font-weight:600; text-transform:none;">⚠️
                                Member / staff number requires exactly 3 digits (e.g., 002)</span>
                        </label>

                        <label class="field">
                            <span>Account created</span>
                            <input th:value="${#temporals.format(profile.createdAt,'dd MMMM yyyy')}" disabled>
                        </label>

                        <label class="field">
                            <span>New password (optional)</span>
                            <span class="password-field">
                                <input id="new-password" name="password" type="password" minlength="8">
                                <button class="password-toggle" type="button" data-password-toggle="new-password"
                                    aria-label="Show password" aria-pressed="false">👁</button>
                            </span>
                        </label>

                        <label class="field">
                            <span>Confirm new password</span>
                            <span class="password-field">
                                <input id="confirm-password" name="confirmPassword" type="password" minlength="8">
                                <button class="password-toggle" type="button" data-password-toggle="confirm-password"
                                    aria-label="Show password" aria-pressed="false">👁</button>
                            </span>
                        </label>
                    </div>
                    <div class="form-footer">
                        <button class="btn btn-amber" type="submit">Save profile →</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <style>
        .phone-input-wrap,
        .staff-number-wrap {
            display: flex;
            align-items: stretch;
            margin-top: 7px;
            border: 1px solid var(--line);
            background: #ffffff;
            border-radius: 4px;
            overflow: hidden;
            transition: .2s border, .2s box-shadow;
        }

        .phone-input-wrap:focus-within,
        .staff-number-wrap:focus-within {
            border-color: var(--amber) !important;
            box-shadow: 0 0 0 3px rgba(231, 168, 75, .16) !important;
        }

        .phone-input-wrap.has-error,
        .staff-number-wrap.has-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(168, 73, 66, 0.2) !important;
        }

        .phone-prefix-badge,
        .staff-prefix-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 14px;
            background: #ffffff;
            color: var(--ink);
            user-select: none;
            flex-shrink: 0;
            border-right: 1px solid var(--line);
        }

        .phone-prefix-badge .phone-country {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .08em;
            color: var(--muted);
        }

        .phone-prefix-badge .phone-code {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: .02em;
        }

        .staff-prefix-badge .staff-prefix-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: .06em;
        }

        .phone-prefix-badge .phone-divider,
        .staff-prefix-badge .staff-prefix-divider {
            display: none;
        }

        .phone-input-wrap input,
        .staff-number-wrap input {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            margin-top: 0 !important;
            padding: 14px 14px !important;
            width: 100% !important;
            font-size: 14px !important;
            font-weight: 600 !important;
            letter-spacing: .08em !important;
            outline: none !important;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const firstNameInput = document.getElementById('firstName');
            const lastNameInput = document.getElementById('lastName');
            const firstNameError = document.getElementById('firstNameError');
            const lastNameError = document.getElementById('lastNameError');
            const phoneInput = document.getElementById('phoneInput');
            const phoneHidden = document.getElementById('phoneHidden');
            const phoneWrap = document.getElementById('phoneWrap');
            const phoneError = document.getElementById('phoneError');
            const staffDigitsInput = document.getElementById('staffDigitsInput');
            const staffPrefixText = document.getElementById('staffPrefixText');
            const staffNumWrap = document.getElementById('staffNumWrap');
            const staffNumError = document.getElementById('staffNumError');
            const membershipNumberHidden = document.getElementById('membershipNumberHidden');
            const profileForm = document.getElementById('profileForm');

            // 1. First Name & Last Name Number Validation
            function validateNameField(input, errorElement, fieldLabel) {
                if (!input) return true;
                const val = input.value || '';
                const hasNumbers = /\d/.test(val);

                if (hasNumbers) {
                    input.style.borderColor = 'var(--danger)';
                    input.style.boxShadow = '0 0 0 3px rgba(168, 73, 66, 0.2)';
                    if (errorElement) {
                        errorElement.textContent = '⚠️ Numbers are not allowed in ' + fieldLabel;
                        errorElement.style.display = 'block';
                    }
                    input.setCustomValidity('Numbers are not allowed in ' + fieldLabel);
                    return false;
                } else {
                    input.style.borderColor = '';
                    input.style.boxShadow = '';
                    if (errorElement) {
                        errorElement.style.display = 'none';
                    }
                    input.setCustomValidity('');
                    return true;
                }
            }

            if (firstNameInput) {
                ['input', 'keyup', 'change', 'blur'].forEach(function (evt) {
                    firstNameInput.addEventListener(evt, function () {
                        validateNameField(firstNameInput, firstNameError, 'First name');
                    });
                });
                validateNameField(firstNameInput, firstNameError, 'First name');
            }

            if (lastNameInput) {
                ['input', 'keyup', 'change', 'blur'].forEach(function (evt) {
                    lastNameInput.addEventListener(evt, function () {
                        validateNameField(lastNameInput, lastNameError, 'Last name');
                    });
                });
                validateNameField(lastNameInput, lastNameError, 'Last name');
            }

            // 2. Phone Number LK +94 & Digits Only Validation
            function formatPhoneDigits(digits) {
                if (digits.length <= 2) return digits;
                if (digits.length <= 5) return digits.slice(0, 2) + ' ' + digits.slice(2);
                return digits.slice(0, 2) + ' ' + digits.slice(2, 5) + ' ' + digits.slice(5);
            }

            function syncPhoneInput() {
                let raw = phoneInput.value.replace(/\D/g, '');
                if (raw.startsWith('0')) {
                    raw = raw.substring(1);
                }
                raw = raw.slice(0, 9);

                phoneInput.value = formatPhoneDigits(raw);

                if (raw.length > 0) {
                    phoneHidden.value = '+94 ' + raw;
                } else {
                    phoneHidden.value = '';
                }

                validatePhoneField(raw);
            }

            function validatePhoneField(digits) {
                if (digits.length > 0 && digits.length < 9) {
                    phoneWrap.classList.add('has-error');
                    phoneError.style.display = 'block';
                    phoneError.textContent = '⚠️ Sri Lankan phone number requires 9 digits (e.g., 7X XXX XXXX)';
                    return false;
                } else {
                    phoneWrap.classList.remove('has-error');
                    phoneError.style.display = 'none';
                    return true;
                }
            }

            if (phoneInput && phoneHidden) {
                let initialRaw = (phoneHidden.value || '').replace(/\D/g, '');
                if (initialRaw.startsWith('94')) initialRaw = initialRaw.substring(2);
                if (initialRaw.startsWith('0')) initialRaw = initialRaw.substring(1);
                initialRaw = initialRaw.slice(0, 9);

                if (initialRaw.length > 0) {
                    phoneInput.value = formatPhoneDigits(initialRaw);
                    phoneHidden.value = '+94 ' + initialRaw;
                } else {
                    phoneInput.value = '';
                    phoneHidden.value = '';
                }

                phoneInput.addEventListener('keydown', function (e) {
                    const allowedControlKeys = [
                        'Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter', 'Home', 'End'
                    ];
                    if (allowedControlKeys.includes(e.key) || e.ctrlKey || e.metaKey) {
                        return;
                    }
                    if (!/^[0-9]$/.test(e.key)) {
                        e.preventDefault();
                    }
                });

                phoneInput.addEventListener('input', syncPhoneInput);
                phoneInput.addEventListener('blur', function () {
                    let digits = phoneInput.value.replace(/\D/g, '');
                    validatePhoneField(digits);
                });
            }

            // 3. Member / Staff Number (Only 3 digits at the end)
            let staffPrefix = 'STAFF-';
            if (membershipNumberHidden && staffDigitsInput) {
                const fullNum = membershipNumberHidden.value || 'STAFF-002';
                const match = fullNum.match(/^(.*?)(\d{1,3})$/);
                if (match) {
                    staffPrefix = match[1];
                    staffDigitsInput.value = match[2].padStart(3, '0');
                } else {
                    staffDigitsInput.value = '002';
                }
                if (staffPrefixText) {
                    staffPrefixText.textContent = staffPrefix;
                }
                membershipNumberHidden.value = staffPrefix + staffDigitsInput.value;

                staffDigitsInput.addEventListener('keydown', function (e) {
                    const allowedControlKeys = [
                        'Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter', 'Home', 'End'
                    ];
                    if (allowedControlKeys.includes(e.key) || e.ctrlKey || e.metaKey) {
                        return;
                    }
                    if (!/^[0-9]$/.test(e.key)) {
                        e.preventDefault();
                    }
                });

                function syncStaffNumber() {
                    let digits = staffDigitsInput.value.replace(/\D/g, '').slice(0, 3);
                    staffDigitsInput.value = digits;
                    membershipNumberHidden.value = staffPrefix + digits;
                    validateStaffDigits(digits);
                }

                function validateStaffDigits(digits) {
                    if (digits.length !== 3) {
                        staffNumWrap.classList.add('has-error');
                        staffNumError.style.display = 'block';
                        staffNumError.textContent = '⚠️ Member / staff number requires exactly 3 digits (e.g., 002)';
                        return false;
                    } else {
                        staffNumWrap.classList.remove('has-error');
                        staffNumError.style.display = 'none';
                        return true;
                    }
                }

                staffDigitsInput.addEventListener('input', syncStaffNumber);
                staffDigitsInput.addEventListener('blur', function () {
                    let digits = staffDigitsInput.value.replace(/\D/g, '');
                    validateStaffDigits(digits);
                });
            }

            // 4. Form Submit Validation
            if (profileForm) {
                profileForm.addEventListener('submit', function (e) {
                    const isFirstValid = validateNameField(firstNameInput, firstNameError, 'First name');
                    const isLastValid = validateNameField(lastNameInput, lastNameError, 'Last name');

                    let rawPhone = phoneInput ? phoneInput.value.replace(/\D/g, '') : '';
                    const isPhoneValid = validatePhoneField(rawPhone);

                    let rawStaffDigits = staffDigitsInput ? staffDigitsInput.value.replace(/\D/g, '') : '';
                    const isStaffValid = !staffDigitsInput || (rawStaffDigits.length === 3);
                    if (staffDigitsInput && rawStaffDigits.length !== 3) {
                        staffNumWrap.classList.add('has-error');
                        staffNumError.style.display = 'block';
                    }

                    if (!isFirstValid || !isLastValid || !isPhoneValid || !isStaffValid) {
                        e.preventDefault();
                        if (!isFirstValid) {
                            firstNameInput.focus();
                        } else if (!isLastValid) {
                            lastNameInput.focus();
                        } else if (!isPhoneValid) {
                            phoneInput.focus();
                        } else if (!isStaffValid) {
                            staffDigitsInput.focus();
                        }
                    }
                });
            }
        });
    </script>
</body>

</html>

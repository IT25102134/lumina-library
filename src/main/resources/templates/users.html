<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Users & roles')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('users')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Users & roles','Access management')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><div class="split-grid"><section class="panel"><div class="panel-head"><h2>System accounts</h2><span class="status" th:text="${#lists.size(users)}+' users'">0</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Role</th><th>Number</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="user:${users}"><td><b th:text="${user.fullName}">Name</b><br><small class="muted" th:text="${user.email}">Email</small></td><td th:text="${user.role.displayName}">Role</td><td th:text="${user.membershipNumber}">Number</td><td><span class="status" th:classappend="${user.active}?'active':'rejected'" th:text="${user.active?'Active':'Disabled'}">Active</span></td><td><form th:action="@{/users/{id}/toggle(id=${user.id})}" method="post"><button class="btn btn-outline btn-sm" th:text="${user.active?'Disable':'Enable'}">Toggle</button></form></td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Create account</h2></div><form class="panel-body form-stack" th:action="@{/users}" method="post"><label>First name<input name="firstName" required></label><label>Last name<input name="lastName" required></label><label>Email<input name="email" type="email" required></label><label>Role<select name="role"><option th:each="role:${roles}" th:value="${role}" th:text="${role.displayName}"></option></select></label><label>Member / staff number<input name="membershipNumber" required placeholder="MEM-2026-002"></label><label>Temporary password<input name="password" type="password" minlength="8" required></label><button class="btn btn-amber">Create secure account →</button></form></section></div></main></div></body></html>

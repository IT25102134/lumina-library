<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Member registration')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('users')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Member registration','Access management')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><div class="split-grid"><section class="panel"><div class="panel-head"><h2>Library members</h2><span class="status" th:text="${#lists.size(users)}+' members'">0</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Login username</th><th>Number</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="user:${users}"><td th:text="${user.fullName}">Name</td><td th:text="${user.email}">Email</td><td th:text="${user.membershipNumber}">Number</td><td><span class="status" th:classappend="${user.active}?'active':'rejected'" th:text="${user.active?'Active':'Disabled'}">Active</span></td><td><form th:action="@{/users/{id}/toggle(id=${user.id})}" method="post"><button class="btn btn-outline btn-sm" th:text="${user.active?'Disable':'Enable'}">Toggle</button></form></td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Register new member</h2></div><form class="panel-body form-stack" th:action="@{/users}" method="post"><label>First name <span class="required" aria-hidden="true">*</span><input name="firstName" required></label><label>Last name <span class="required" aria-hidden="true">*</span><input name="lastName" required></label><label>Login username (email address) <span class="required" aria-hidden="true">*</span><input name="email" type="email" required></label><label>Membership number <span class="required" aria-hidden="true">*</span><input name="membershipNumber" required placeholder="MEM-2026-002"></label><label>Registration fee (LKR) <span class="required" aria-hidden="true">*</span><input name="registrationFee" type="number" min="0" step="0.01" required></label><label>Temporary password <span class="required" aria-hidden="true">*</span><span class="password-field"><input id="temporary-password" name="password" type="password" minlength="8" required><button class="password-toggle" type="button" data-password-toggle="temporary-password" aria-label="Show password" aria-pressed="false">👁</button></span></label><button class="btn btn-amber">Register member →</button></form></section></div></main></div></body></html>

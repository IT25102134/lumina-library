<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Inventory')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('inventory')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Inventory & assets','Physical collection')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><div class="split-grid"><section class="panel"><div class="panel-head"><h2>Physical copies</h2><span class="status" th:text="${#lists.size(copies)}+' total'">0 total</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Barcode / title</th><th>Shelf</th><th>Status</th><th>Update</th></tr></thead><tbody><tr th:each="copy:${copies}"><td><b th:text="${copy.barcode}">Barcode</b><br><small class="muted" th:text="${copy.book.title}">Title</small></td><td th:text="${copy.shelfLocation}">Shelf</td><td><span class="status" th:classappend="${#strings.toLowerCase(copy.status.name())}" th:text="${copy.status}">AVAILABLE</span></td><td><form class="inline-form" th:action="@{/inventory/{id}/status(id=${copy.id})}" method="post"><input name="shelfLocation" th:value="${copy.shelfLocation}" size="8" required><select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==copy.status}"></option></select><button class="btn btn-ink btn-sm">Save</button></form></td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><h2>Add physical copy</h2></div><form class="panel-body form-stack" th:action="@{/inventory}" method="post"><label>Catalogue title<select name="bookId" required><option value="">Select a book…</option><option th:each="book:${books}" th:value="${book.id}" th:text="${book.title}+' · '+${book.isbn}"></option></select></label><label>Unique barcode<input name="barcode" required placeholder="LUM-0007"></label><label>Shelf location<input name="shelfLocation" required placeholder="A-02-03"></label><button class="btn btn-amber">Add to inventory →</button></form></section></div></main></div></body></html>

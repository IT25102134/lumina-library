<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inventory')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('inventory')}"></aside>
<div class="app-shell">
    <header th:replace="~{fragments/layout :: topbar('Inventory & assets','Physical collection')}"></header>
    <main class="content">
        <div th:replace="~{fragments/layout :: flashes}"></div>

        <div class="page-actions">
            <form class="search-bar" th:action="@{/inventory}" method="get">
                <input name="q" th:value="${q}" placeholder="Search barcode, title, author, ISBN or shelf…">
                <select name="status" style="border:0;background:transparent;outline:none;font-size:12px;padding:0 8px;border-left:1px solid var(--line);">
                    <option value="">All statuses</option>
                    <option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s.name() == selectedStatus}"></option>
                </select>
                <button class="btn btn-ink btn-sm">Filter</button>
                <a th:if="${(q != null and !#strings.isEmpty(q)) or (selectedStatus != null and !#strings.isEmpty(selectedStatus))}" th:href="@{/inventory}" class="btn btn-outline btn-sm">Reset</a>
            </form>
        </div>

        <div class="split-grid">
            <section class="panel">
                <div class="panel-head">
                    <h2>Physical copies</h2>
                    <span class="status" th:text="${#lists.size(copies)}+' total'">0 total</span>
                </div>
                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Barcode / title</th>
                                <th>Shelf</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="copy:${copies}">
                                <td>
                                    <b th:text="${copy.barcode}">Barcode</b><br>
                                    <small class="muted" th:text="${copy.book.title}">Title</small>
                                </td>
                                <td th:text="${copy.shelfLocation}">Shelf</td>
                                <td>
                                    <span class="status" th:classappend="${#strings.toLowerCase(copy.status.name())}" th:text="${copy.status}">AVAILABLE</span>
                                </td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                                        <div th:if="${copy.status.name() == 'LOANED' or copy.status.name() == 'RESERVED'}" style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;">
                                            <span>🔒 Managed by Circulation</span>
                                        </div>
                                        <form th:unless="${copy.status.name() == 'LOANED' or copy.status.name() == 'RESERVED'}" class="inline-form" th:action="@{/inventory/{id}/status(id=${copy.id})}" method="post">
                                            <input name="shelfLocation" th:value="${copy.shelfLocation}" size="8" required placeholder="Shelf">
                                            <select name="status">
                                                <option th:each="s:${assignableStatuses}" th:value="${s}" th:text="${s}" th:selected="${s==copy.status}"></option>
                                            </select>
                                            <button class="btn btn-ink btn-sm">Save</button>
                                        </form>
                                        <form class="inline-form" th:attr="data-confirm='Are you sure you want to permanently delete physical copy ' + ${copy.barcode} + '?'" th:action="@{/inventory/{id}/delete(id=${copy.id})}" method="post">
                                            <button class="btn btn-danger btn-sm" title="Delete copy">Delete</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(copies)}">
                                <td colspan="4" class="empty-state">
                                    <strong>No physical copies found</strong>
                                    <span class="muted">No physical inventory matched the current query or status filter.</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Add physical copy</h2>
                </div>
                <form class="panel-body form-stack" th:action="@{/inventory}" method="post">
                    <label>
                        <span style="display:flex;justify-content:space-between;align-items:baseline;">
                            <span>Catalogue title</span>
                            <a th:href="@{/catalog/manage/new}" style="font-size:11px;color:var(--amber-2,#9b681f);text-transform:none;font-weight:600;">＋ Add new catalogue title</a>
                        </span>
                        <select name="bookId" required>
                            <option value="">Select a book…</option>
                            <option th:each="book:${books}" th:value="${book.id}" th:text="${book.title}+' · '+${book.isbn}"></option>
                        </select>
                    </label>
                    <label>Unique barcode
                        <input name="barcode" required placeholder="LUM-0007">
                    </label>
                    <label>Shelf location
                        <input name="shelfLocation" required placeholder="A-02-03">
                    </label>
                    <button class="btn btn-amber">Add to inventory →</button>
                </form>
            </section>
        </div>
    </main>
</div>
</body>
</html>

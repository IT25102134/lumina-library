<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Feedback cases')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('feedback-manage')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Feedback & complaints','Case management')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><section class="stack"><article class="panel case-card" th:each="item:${items}"><header><div><span class="pill" th:text="${item.type}">TYPE</span><h3 th:text="${item.subject}">Subject</h3><small class="muted" th:text="${item.member.fullName}+' · #'+${item.id}+' · '+${#temporals.format(item.createdAt,'dd MMM yyyy HH:mm')}">Member</small></div><span class="status" th:classappend="${#strings.toLowerCase(item.status.name())}" th:text="${item.status}">OPEN</span></header><p class="message" th:text="${item.message}">Message</p><form class="inline-form" th:action="@{/feedback/manage/{id}(id=${item.id})}" method="post"><select name="status"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==item.status}"></option></select><textarea name="response" required placeholder="Write a clear, helpful response…" th:text="${item.response}"></textarea><button class="btn btn-amber btn-sm">Update case</button></form></article><div th:if="${#lists.isEmpty(items)}" class="panel empty-state"><strong>Inbox zero</strong>No feedback cases require review.</div></section></main></div></body></html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071b22">
    <title th:text="${title} + ' · Lumina Library'">Lumina Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
    <a class="brand" th:href="@{/dashboard}"><span class="brand-mark">L</span><span><b>Lumina</b><small>Public Library</small></span></a>
    <nav class="nav-stack">
        <a sec:authorize="!hasRole('EVENT_COORDINATOR')" th:href="@{/dashboard}" th:classappend="${active=='dashboard'}?'active'"><span>⌂</span>Overview</a>
        <a sec:authorize="hasAnyRole('HEAD_LIBRARIAN','MEMBER')" th:href="@{/catalog}" th:classappend="${active=='catalog'}?'active'"><span>▤</span>Catalogue</a>
        <a sec:authorize="hasRole('HEAD_LIBRARIAN')" th:href="@{/users}" th:classappend="${active=='users'}?'active'"><span>♙</span>Member registration</a>
        <a sec:authorize="hasRole('MEMBER')" th:href="@{/my-library}" th:classappend="${active=='my-library'}?'active'"><span>◫</span>My Library</a>
        <a sec:authorize="hasAnyRole('EVENT_COORDINATOR','MEMBER')" th:href="@{/events}" th:classappend="${active=='events'}?'active'"><span>◉</span>Events</a>
        <a sec:authorize="hasRole('EVENT_COORDINATOR')" th:href="@{/profile}" th:classappend="${active=='profile'}?'active'"><span>♟</span>Profile</a>

        <!-- Member: submit feedback and view their own cases -->
        <a sec:authorize="hasRole('MEMBER')" th:href="@{/feedback}" th:classappend="${active == 'feedback'} ? 'active' : ''"><span>✉</span>Feedback &amp; Complaints</a>

        <!-- Library manager: review and manage member cases -->
        <a sec:authorize="hasRole('LIBRARY_MANAGER')" th:href="@{/feedback/manage}" th:classappend="${active == 'feedback-manage'} ? 'active' : ''"><span>✉</span>Feedback &amp; Complaints</a>

    </nav>
    <div class="sidebar-user">
        <div class="avatar" th:text="${#strings.substring(currentUser.firstName,0,1)}">M</div>
        <div><b th:text="${currentUser.fullName}">Member</b><small th:text="${currentUser.role.displayName}">Role</small></div>
        <form sec:authorize="!hasRole('EVENT_COORDINATOR')" th:action="@{/logout}" method="post"><button title="Sign out" class="icon-btn">↗</button></form>
    </div>
</aside>

<header class="topbar" th:fragment="topbar(title,eyebrow)">
    <button class="menu-toggle" data-menu>☰</button>
    <div><small th:text="${eyebrow}">Workspace</small><h1 th:text="${title}">Dashboard</h1></div>
    <div class="top-actions">
        <form sec:authorize="hasRole('EVENT_COORDINATOR')" th:action="@{/logout}" method="post">
            <button type="submit" class="notification-link" title="Sign out" aria-label="Sign out" style="cursor:pointer;background:#fff;color:var(--ink);display:grid;place-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </form>
        <th:block sec:authorize="!hasRole('EVENT_COORDINATOR')">
            <a class="avatar" th:href="@{/profile}" th:text="${#strings.substring(currentUser.firstName,0,1)}">M</a>
        </th:block>
    </div>
</header>

<div th:fragment="flashes" class="flash-wrap">
    <div th:if="${success}" class="flash success" th:text="${success}"></div>
    <div th:if="${error}" class="flash error" th:text="${error}"></div>
</div>
</body></html>

<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Events')}"></head><body><aside th:replace="~{fragments/layout :: sidebar('events')}"></aside><div class="app-shell"><header th:replace="~{fragments/layout :: topbar('Events & programs','Community calendar')}"></header><main class="content"><div th:replace="~{fragments/layout :: flashes}"></div><div class="page-actions"><p>Workshops, reading circles and moments of shared discovery.</p><a sec:authorize="hasAnyRole('EVENT_COORDINATOR','HEAD_LIBRARIAN')" th:href="@{/events/manage/new}" class="btn btn-amber">＋ Create program</a></div>
<section class="event-list"><article class="event-card" th:each="event:${events}"><time class="event-date"><strong th:text="${#temporals.format(event.startAt,'dd')}">12</strong><span th:text="${#temporals.format(event.startAt,'MMM yyyy')}">SEP</span><small th:text="${#temporals.format(event.startAt,'HH:mm')}">18:00</small></time><div><div class="inline-form"><span class="status" th:classappend="${#strings.toLowerCase(event.status.name())}" th:text="${event.status}">Published</span><span class="muted" th:text="${counts[event.id]}+'/'+${event.capacity}+' places'">0/30</span></div><h3 th:text="${event.title}">Event title</h3><p th:text="${event.description}">Description</p><div class="event-meta" th:text="'⌖ '+${event.location}">Location</div><div class="card-actions"><form sec:authorize="hasRole('MEMBER')" th:if="${event.status.name()=='PUBLISHED'}" th:action="@{/events/{id}/register(id=${event.id})}" method="post"><button class="btn btn-amber btn-sm">Reserve a place</button></form><a sec:authorize="hasAnyRole('EVENT_COORDINATOR','HEAD_LIBRARIAN')" class="btn btn-outline btn-sm" th:href="@{/events/manage/{id}/edit(id=${event.id})}">Edit program</a></div></div></article></section><div th:if="${#lists.isEmpty(events)}" class="panel empty-state"><strong>No programs scheduled</strong>Create the first gathering for your community.</div>
</main></div></body></html>

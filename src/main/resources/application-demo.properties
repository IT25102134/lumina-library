# Keep H2 outside the synced repository so each developer has a private database and lock file.
spring.datasource.url=jdbc:h2:file:${LUMINA_DB_PATH:${user.home}/.lumina/lumina-demo};MODE=MSSQLServer;AUTO_SERVER=TRUE
server.port=${SERVER_PORT:8081}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
app.open-browser=${OPEN_BROWSER:true}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lumina-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Lumina_Strong1!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - lumina_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  lumina_sql_data:
